name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # GATE (runs first, before build/upload): refuse to publish while the live
      # GitHub repo description has drifted from the source of truth
      # (pyproject.toml [project].description). A stale description fails the whole
      # publish job, so nothing reaches PyPI until it is fixed — a real gate, not
      # an after-the-fact report. The description is not writable from a CI token,
      # so the fix is a manual paste; the failure prints the exact string to paste,
      # then you re-run this workflow.
      #
      # (Through v0.8.66 this was a separate, deliberately non-gating job. That let
      # a release ship with a stale description while the check went red beside it,
      # which is exactly the class of bug this replaces: a check that reports drift
      # after the release is not a check.)
      - name: Refuse to publish on a stale GitHub description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          expected="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['description'])")"
          live="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.description // ""')"
          if [ "$expected" != "$live" ]; then
            echo "::error::Release blocked: the live GitHub description has drifted from pyproject.toml [project].description. It cannot be written from a CI token. Paste the exact string below into repo Settings > Description, then re-run this workflow."
            printf '\n----- paste this into Settings > Description -----\n%s\n--------------------------------------------------\n\n' "$expected"
            printf 'live now: %s\n' "$live"
            exit 1
          fi
          echo "Live repo description matches pyproject.toml [project].description."

      # GATE: refuse to publish a stale competitive claim. The README's benchmark
      # table includes a head-to-head against a named third-party product at a pinned
      # version; that decays, and a stale one is worse for credibility than no claim.
      # Release-time rather than every-push on purpose — failing unrelated commits for
      # weeks is how a gate gets switched off. See scripts/check_benchmark_freshness.py.
      - name: Refuse to publish a benchmark claim older than 30 days
        run: python3 scripts/check_benchmark_freshness.py --release

      # GATE: refuse to publish a release that silently skips a version. --distance-only
      # on purpose: at publish time the repo is ALWAYS ahead of the registry, so the
      # unpublished-age half of this gate would fail the very release that resolves it.
      # A gate that blocks its own remedy is a deadlock. The distance half has no such
      # problem. See scripts/check_registry_parity.py.
      - name: Refuse to publish a version that skips one
        run: python3 scripts/check_registry_parity.py --distance-only

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
