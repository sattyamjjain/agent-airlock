site_name: Agent-Airlock
site_description: A deny-by-default contract layer for AI agent tool calls - strict argument validation, ghost-argument stripping and self-healing retries, in-process and Pydantic-only
site_url: https://sattyamjjain.github.io/agent-airlock/
repo_url: https://github.com/sattyamjjain/agent-airlock
repo_name: sattyamjjain/agent-airlock

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            heading_level: 2

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # `base_path` is the repo root, not docs/, so a docs page can pull in a file
  # that lives outside the docs tree. Two benchmark artifacts are generated into
  # the source tree by their own runners -- benchmarks/blockrate/RESULTS.md by
  # benchmarks/blockrate/report.py, and BENCHMARK.md by
  # scripts/generate_benchmark.py, whose --check is a CI drift gate. Neither can
  # be moved or hand-copied into docs/ without either breaking its generator or
  # creating a second copy to drift. They are included instead, so there is
  # exactly one of each on disk.
  #
  # check_paths makes a missing or moved snippet fail `mkdocs build --strict`
  # rather than silently rendering an empty page.
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Configuration: getting-started/configuration.md
  - User Guide:
    - Core Concepts: guide/concepts.md
    - Validation: guide/validation.md
    - Policy Engine: guide/policy.md
    - PII Masking: guide/sanitization.md
    - E2B Sandbox: guide/sandbox.md
    - FastMCP Integration: guide/mcp.md
  - API Reference:
    - Airlock Decorator: api/airlock.md
    - Configuration: api/config.md
    - Policy: api/policy.md
    - Sanitizer: api/sanitizer.md
    - Sandbox: api/sandbox.md
    - MCP: api/mcp.md
  - Examples:
    - Basic Usage: examples/basic.md
    - Policy Examples: examples/policy.md
    - PII Masking: examples/pii.md
    - Sandbox Execution: examples/sandbox.md
  - Commerce Adapters: adapters.md
  - CVE Catalog: cves/index.md
  - CVE Triage Rule: cve-triage.md
  # Every file under docs/benchmarks/ must appear below. mkdocs publishes a page
  # whether or not it is in nav, so three of these built and were reachable only
  # by direct URL for months, with nothing linking to them. That gap is now a
  # build failure: scripts/check_benchmark_freshness.py asserts nav covers the
  # directory.
  - Benchmarks:
    - Overview: benchmarks/index.md
    - Cross-tool block rate: benchmarks/blockrate.md
    - Guard-suite corpus: benchmarks/full-corpus.md
    - Multi-harness prompt injection: benchmarks/injection-multi-harness.md
    - Native MCP gateway head-to-head: benchmarks/vs-native-mcp-gateway.md
    - MCP gateway payload gap: benchmarks/mcp-gateway-payload-gap.md
  - Framework Integrations:
    - Compatibility matrix: COMPATIBILITY.md
    - Google ADK: integrations/google-adk.md
    - PydanticAI: integrations/pydantic-ai.md
    - CrewAI: integrations/crewai.md
    - Claude Agent SDK: integrations/anthropic-claude-agent-sdk.md
    - Managed Agents: integrations/managed-agents.md
  - CLI:
    - Kill switch: cli/kill-switch.md
    - Policy bundle lock: cli/policy-bundle-lock.md
    - Policy compile / explain: cli/policy-compile-explain.md
    - Attest receipt: cli/attest-receipt.md
    - Console: cli/console.md
    - Graph serve: cli/graph-serve.md
    - Studio: cli/studio.md
    - Scan tools: scan-tools.md
    - Egress bench: cli/egress-bench.md
  - Observability:
    - OTel Semantic Conventions: observability/semconv.md
  - Security: SECURITY.md
  - Contributing: https://github.com/sattyamjjain/agent-airlock/blob/main/CONTRIBUTING.md
  - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sattyamjjain/agent-airlock
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/agent-airlock/

