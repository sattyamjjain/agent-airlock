# Evidence behind the README's "MCP-specific mapping" table (OWASP MCP Top 10, beta).
#
# risks: one entry per MCP01-MCP10. risk_name is the title the tests pin
# (MCP_TOP_10_2026 in tests/owasp_agentic_coverage/test_coverage_completeness.py);
# coverage is the README label; justification says why that label holds.
# controls: one entry per control the README row names, in README order. `control` is the
# README's own wording and must appear verbatim in that row. `runs` is where it runs:
# "step N" (an `# Step N` comment in core.py), "execute", "post-execution", "wrapper"
# (all on the @Airlock call path), "own decorator", or "host-called" (a helper the host
# calls itself; the @Airlock wrapper never does). modules / presets / tests are
# comma-separated; presets may be empty.
#
# Rendered to docs/owasp-mcp-top-10-coverage.md by
# agent_airlock.owasp_agentic_coverage.mcp_top10 and byte-diffed by
# tests/owasp_agentic_coverage/test_mcp_top10_coverage.py.
spec_version: "beta"
spec_url: "https://owasp.org/www-project-mcp-top-10/"
last_verified_global: "2026-11-10"
risks:
  - risk_id: "MCP01"
    risk_name: "Token Mismanagement & Secret Exposure"
    coverage: "Partial"
    justification: "On the call path, `ArgumentSecretGuard` refuses secrets in arguments when a policy sets it, and the sanitizer masks the secrets its detectors find in output; `MCPProxyGuard` runs only where a proxy calls it. Hard-coded credentials, token lifetime, and secrets the host keeps in model memory or its own logs are out of scope."
    last_verified: "2026-11-10"
    measured_block_rate: "not measured"
  - risk_id: "MCP02"
    risk_name: "Privilege Escalation via Scope Creep"
    coverage: "Partial"
    justification: "Agent identity (step 2) and capability gating (step 4) run on every call. `CredentialScope` runs only where the host calls `MCPProxyGuard.validate_tool_credentials()`, and the union boundary only at `CapabilityCapEngine.grant_lease()`. The scopes an authorization server grants a server, and how they grow, are set outside the call boundary. Was Full until 2026-11-10."
    last_verified: "2026-11-10"
    measured_block_rate: "not measured"
  - risk_id: "MCP03"
    risk_name: "Tool Poisoning"
    coverage: "Partial"
    justification: "Ghost-argument rejection, the tool-name deny list and `SafePath` / `SafeURL` check each call. The description-manifest guard runs only where the host checks a tool at admission, and compares declared arguments and side effects, not instructions written into a description. A poisoned description that steers the model into well-formed calls to allowed tools passes all four; the [MCPTox replay](benchmarks/mcptox.md) counts how often. Was Full until 2026-11-10."
    last_verified: "2026-11-10"
    measured_block_rate: "not measured"
  - risk_id: "MCP04"
    risk_name: "Software Supply Chain Attacks & Dependency Tampering"
    coverage: "Partial"
    justification: "The tool-name deny list refuses `download_plugin_*` / `fetch_plugin_*` calls on the call path. The Ox stdio defaults screen a server's launch command only where the host calls `validate_stdio_command()` before spawning it. A tampered package or dependency inside an MCP server is out of scope. Was Full until 2026-11-10."
    last_verified: "2026-11-10"
    measured_block_rate: "not measured"
  - risk_id: "MCP05"
    risk_name: "Command Injection & Execution"
    coverage: "Full"
    justification: "Untrusted input reaches a command through a tool argument or a server's launch command, and a control covers each. On the call path, `ToolArgSinkGuard` (step 2.75) and `ShellCommandPolicy` (step 2.77) screen arguments when a policy sets them, the tool-name deny list (step 2) refuses shell-shaped tools, and `sandbox=True` runs the tool in E2B. The stdio guard screens launch commands and `CodeSandboxBridgeGuard` is a second argument screen; the host calls both."
    last_verified: "2026-11-10"
    measured_block_rate: "not measured"
  - risk_id: "MCP06"
    risk_name: "Intent Flow Subversion"
    coverage: "Partial"
    justification: "`ToolOutputTrustGuard` checks each result after the tool runs when the config sets one, and `@requires_human_oversight` holds a decorated tool for an approver. Instructions the output screen does not flag, and prompts that reach the model outside a tool result, are out of scope."
    last_verified: "2026-11-10"
    measured_block_rate: "not measured"
  - risk_id: "MCP07"
    risk_name: "Insufficient Authentication & Authorization"
    coverage: "Partial"
    justification: "Every listed control is a helper or preset the host calls at an OAuth or MCP protocol step (authorization, discovery, request routing, step-up, Tasks); the `@Airlock` wrapper calls none of them. Transport-level authentication stays with the MCP server."
    readme_note: "Transport-level auth remains server-side"
    last_verified: "2026-11-10"
    measured_block_rate: "not measured"
  - risk_id: "MCP08"
    risk_name: "Lack of Audit and Telemetry"
    coverage: "Partial"
    justification: "The `@Airlock` wrapper writes a JSON Lines record for every call it handles, refused calls included (on by default), and a hash-chained decision record when the config sets a `DecisionLog`. OpenTelemetry export and spans and metrics run only where the host wires them; the wrapper emits neither. Context changes and model interactions outside a tool call are not recorded. Was Full until 2026-11-10."
    last_verified: "2026-11-10"
    measured_block_rate: "not measured"
  - risk_id: "MCP09"
    risk_name: "Shadow MCP Servers"
    coverage: "Partial"
    justification: "Attested admission and the LAN guard check a server the host routes through them, before its tools are used. Finding an MCP server deployed outside governance, which never reaches these checks, is out of scope."
    last_verified: "2026-11-10"
    measured_block_rate: "not measured"
  - risk_id: "MCP10"
    risk_name: "Context Injection & Over-Sharing"
    coverage: "Partial"
    justification: "The sanitizer masks the PII and secrets its detectors find in each result (on by default), and `ToolOutputTrustGuard` envelopes flagged output when the config sets one. The workspace-scoped `WorkspacePIIConfig` applies only through `sanitize_with_workspace_config()`, which the host calls. Context the host shares or keeps across tasks, users or agents, and sensitive data no detector matches, are out of scope. Was Full until 2026-11-10."
    last_verified: "2026-11-10"
    measured_block_rate: "not measured"
controls:
  - risk_id: "MCP01"
    control: "`MCPProxyGuard` rejects passthrough headers and enforces audience"
    runs: "host-called"
    how: "`MCPProxyGuard.validate_request()`, in an MCP proxy"
    modules: "agent_airlock.mcp_proxy_guard"
    presets: ""
    tests: "tests/test_mcp_proxy_guard.py"
  - risk_id: "MCP01"
    control: "`ArgumentSecretGuard` refuses secrets in arguments"
    runs: "step 2.76"
    how: "when the policy sets `argument_secret_guard`"
    modules: "agent_airlock.argument_secret_guard"
    presets: "argument_secret_defaults"
    tests: "tests/test_argument_secret_guard_0_10_29.py"
  - risk_id: "MCP01"
    control: "sanitizer masks secrets in tool output"
    runs: "post-execution"
    how: "`mask_secrets`, on by default"
    modules: "agent_airlock.sanitizer"
    presets: ""
    tests: "tests/test_sanitizer.py"
  - risk_id: "MCP02"
    control: "`SecurityPolicy(require_agent_id=True)`"
    runs: "step 2"
    how: "refuses a call with no agent identity"
    modules: "agent_airlock.policy"
    presets: "owasp_mcp_top_10_2026_policy"
    tests: "tests/test_policy_identity.py"
  - risk_id: "MCP02"
    control: "capability gating"
    runs: "step 4"
    how: "the policy's `CapabilityPolicy` against the tool's `@requires`"
    modules: "agent_airlock.capabilities"
    presets: "owasp_mcp_top_10_2026_policy"
    tests: "tests/test_capabilities.py"
  - risk_id: "MCP02"
    control: "`CredentialScope`"
