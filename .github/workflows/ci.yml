name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 promoted to required in v0.7.1 after two release cycles
        # (v0.6.1 + v0.7.0) of green CI runs with continue-on-error.
        # All four versions are now hard-failures.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src/ tests/

      - name: Type check with mypy
        run: |
          mypy src/

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=agent_airlock --cov-report=xml --cov-report=term-missing --cov-fail-under=82

      - name: Benchmark drift gate
        if: matrix.python-version == '3.11'
        run: |
          python3 scripts/generate_benchmark.py --check

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Generate coverage badge
        if: matrix.python-version == '3.11' && github.ref == 'refs/heads/main'
        run: |
          pip install coverage-badge
          coverage-badge -o coverage.svg -f

  bare-install:
    # The zero-core-dependency claim, enforced. A bare `pip install agent-airlock`
    # (no extras) must resolve to Pydantic only and still import + run through the
    # stdlib logging shim in agent_airlock/_log.py. The `test` job installs
    # `.[dev]` (which includes structlog), so this is the ONLY job that exercises
    # the fallback path — added in v0.8.59 when structlog moved to the [logging]
    # extra. Nothing read [project].dependencies before, which is why the claim
    # drifted silently for 24 releases.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bare install (no extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: structlog must be absent on a bare install
        run: |
          if pip list --format=freeze | grep -qiE '^structlog=='; then
            echo "::error::structlog is installed on a bare 'pip install agent-airlock' — the zero-core-dependency claim is false."
            pip list --format=freeze | grep -iE '^structlog=='
            exit 1
          fi
          echo "OK: structlog absent on a bare install (Pydantic-only core)"

      - name: Core imports and runs through the logging shim
        run: |
          python -c "import agent_airlock; from agent_airlock import Airlock; from agent_airlock.audit import AuditLogger; from agent_airlock.policy_presets import list_active; print(len(list_active()))"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check src/ tests/

  version-tag-guard:
    # Fail if a version bump lands on main and lingers untagged (the 0.8.56-for-two-days
    # failure). Only on main pushes: a release PR legitimately carries the bump ahead of
    # the tag. Needs full history + tags, so fetch-depth: 0.
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Declared version must have a matching tag
        run: python3 scripts/check_version_tagged.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety cyclonedx-bom

      - name: Run Bandit security scan
        run: bandit -r src/agent_airlock/ -f txt

      - name: Run Safety dependency check
        run: pip freeze | safety check --stdin
        continue-on-error: true  # Don't fail on deprecation warnings

      - name: Generate SBOM
        run: |
          pip install -e .
          cyclonedx-py environment --pyproject pyproject.toml --output-format JSON -o sbom.json --mc-type library

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  docs:
    # Strict build: a broken internal link or a nav/file mismatch fails CI,
    # rather than shipping a docs site with dead links. Same build the Pages
    # deploy (.github/workflows/docs.yml) runs, minus the push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build docs (strict)
        run: mkdocs build --strict
