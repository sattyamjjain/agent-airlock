name: Deploy docs to Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/agent_airlock/**" # mkdocstrings renders docstrings from source
      - ".github/workflows/docs.yml"
  workflow_dispatch: # manual re-trigger (e.g. after a runner outage)

permissions:
  contents: write # mkdocs gh-deploy pushes the built site to the gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gh-deploy needs history to update gh-pages

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install docs deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Deploy to gh-pages
        run: mkdocs gh-deploy --force
