name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 promoted to required in v0.7.1 after two release cycles
        # (v0.6.1 + v0.7.0) of green CI runs with continue-on-error.
        # All four versions are now hard-failures.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src/ tests/

      - name: Type check with mypy
        run: |
          mypy src/

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=agent_airlock --cov-report=xml --cov-report=term-missing --cov-fail-under=82

      - name: Benchmark drift gate
        if: matrix.python-version == '3.11'
        run: |
          python3 scripts/generate_benchmark.py --check

      # The pytest-benchmark suite is --ignore'd by the default addopts, so before
      # v0.8.80 it ran only via `make bench` — which no CI job called. It could break
      # silently, and the README quotes its median-84us figure for the full @Airlock
      # path. This runs it so that cannot happen.
      #
      # Deliberately NOT a latency threshold. Shared GitHub runners are noisy enough
      # that --benchmark-compare-fail would flap, and a gate that flaps is a gate that
      # gets switched off (the same reasoning as the release-only benchmark-freshness
      # check). This asserts the suite still executes and still produces numbers; the
      # published figures come from a local run on known hardware.
      - name: Performance benchmark suite (smoke, not a latency gate)
        if: matrix.python-version == '3.11'
        run: |
          python3 -m pytest tests/benchmarks/ --benchmark-only --no-cov -q

      # Codecov upload removed in v0.8.79. It ran on all four Python versions,
      # uploaded tokenless (no CODECOV_TOKEN was ever configured), landed nowhere
      # — codecov.io 301s and the API 500s for this repo — and carried
      # `fail_ci_if_error: false`, so nothing ever caught it. The README badge it
      # fed rendered "unknown" next to a coverage claim. The honest coverage number
      # comes from `--cov-fail-under=82` above (a real gate) and the generated
      # TEST-BADGE block in the README. Re-add this step together with a token and
      # `fail_ci_if_error: true` if Codecov is ever actually adopted.
      #
      # The `coverage-badge -o coverage.svg` step went with it: nothing in the repo
      # ever referenced the file it wrote.

  bare-install:
    # The zero-core-dependency claim, enforced as an EXHAUSTIVE allowlist. A bare
    # `pip install agent-airlock` (no extras) must resolve to Pydantic + its transitive
    # runtime closure and NOTHING else, and still import + run through the stdlib logging
    # shim in agent_airlock/_log.py. The `test` job installs `.[dev]` (which includes
    # structlog), so this is the ONLY job that exercises the Pydantic-only core — added
    # in v0.8.59 when structlog moved to the [logging] extra. Through v0.8.67 the check
    # was a structlog-specific denylist, which would wave through any OTHER dependency
    # that crept into [project.dependencies]; scripts/check_core_deps.py now fails on any
    # installed distribution outside the dynamically-derived Pydantic closure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Bare install (no extras) into a fresh venv
        # A fresh venv gives a deterministic baseline (only pip/setuptools/wheel are
        # seeded), so the allowlist gate measures exactly what `pip install agent-airlock`
        # pulls — not whatever the runner's base interpreter happened to carry.
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/python -m pip install --upgrade pip
          /tmp/bare/bin/pip install -e .

      - name: Installed set must be Pydantic-only (exhaustive allowlist)
        run: /tmp/bare/bin/python scripts/check_core_deps.py

      - name: Core imports and runs through the logging shim
        run: |
          /tmp/bare/bin/python -c "import agent_airlock; from agent_airlock import Airlock; from agent_airlock.audit import AuditLogger; from agent_airlock.policy_presets import list_active; print(len(list_active()))"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check src/ tests/

  version-tag-guard:
    # Fail if a version bump lands on main and lingers untagged (the 0.8.56-for-two-days
    # failure). Only on main pushes: a release PR legitimately carries the bump ahead of
    # the tag. Needs full history + tags, so fetch-depth: 0.
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Declared version must have a matching tag
        run: python3 scripts/check_version_tagged.py

      - name: Declared version must have a conformant CHANGELOG heading
        run: python3 scripts/check_changelog_heading.py

      # One seam further out than the two gates above: those compare repo surfaces to
      # each other, which is why a repo that agreed with itself about an unpublished
      # 0.8.83 passed both. This one compares against PyPI. Lenient when PyPI is
      # unreachable. See scripts/check_registry_parity.py.
      - name: Declared version must not have outrun PyPI
        run: python3 scripts/check_registry_parity.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety cyclonedx-bom

      - name: Run Bandit security scan
        # -c makes [tool.bandit] in pyproject.toml authoritative. Without it that block was
        # silently inert, so the repo's stated scan config and the scan actually run had
        # drifted apart with no way to notice.
        run: bandit -c pyproject.toml -r src/agent_airlock/ -f txt

      - name: Run Safety dependency check
        run: pip freeze | safety check --stdin
        continue-on-error: true  # Don't fail on deprecation warnings

      - name: Generate SBOM
        run: |
          pip install -e .
          cyclonedx-py environment --pyproject pyproject.toml --output-format JSON -o sbom.json --mc-type library

      - name: Upload SBOM
        uses: actions/upload-artifact@v5
        with:
          name: sbom
          path: sbom.json

  docs:
    # Strict build: a broken internal link or a nav/file mismatch fails CI,
    # rather than shipping a docs site with dead links. Same build the Pages
    # deploy (.github/workflows/docs.yml) runs, minus the push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install docs deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build docs (strict)
        run: mkdocs build --strict

      # Dead-link gate. At v0.8.79 the README carried nine dead links across eight
      # targets, two of them into directories that never existed. Nothing watched
      # them, so they rotted. Relative links only — external URLs would make this
      # flaky on rate limits rather than on repo defects.
      - name: Refuse dead relative links in markdown
        run: python3 scripts/check_links.py
